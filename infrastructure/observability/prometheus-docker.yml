# Prometheus for the all-in-Docker mode (docker-compose.apps.yml): services are reached by container name on the compose network.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: apg
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:        # the gateway exposes actuator on its INTERNAL port 8180, never on 8080
          - api-gateway:8180
          - auth-service:8081
          - merchant-service:8082
          - order-service:8083
          - payment-service:8084
          - provider-integration:8085
          - payment-orchestrator:8086
          - webhook-service:8087
          - refund-service:8088
          - ledger-service:8089
          - settlement-service:8090
          - notification-service:8091
          - payment-link-service:8092

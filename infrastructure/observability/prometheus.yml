# Local Prometheus for APG. Services run on the host (scripts/dev-start.sh), Prometheus runs in Docker.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: apg
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:        # the gateway exposes actuator on its INTERNAL port 8180, never on 8080
          - host.docker.internal:8180   # api-gateway
          - host.docker.internal:8081   # auth-service
          - host.docker.internal:8082   # merchant-service
          - host.docker.internal:8083   # order-service
          - host.docker.internal:8084   # payment-service
          - host.docker.internal:8085   # provider-integration
          - host.docker.internal:8086   # payment-orchestrator
          - host.docker.internal:8087   # webhook-service
          - host.docker.internal:8088   # refund-service
          - host.docker.internal:8089   # ledger-service
          - host.docker.internal:8090   # settlement-service
          - host.docker.internal:8091   # notification-service

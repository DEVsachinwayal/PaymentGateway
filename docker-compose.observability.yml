# Add-on for the all-in-Docker mode: Prometheus + Grafana scraping the containers by name.
#   docker compose -f docker-compose.yml -f docker-compose.apps.yml -f docker-compose.demo.yml -f docker-compose.observability.yml --profile observability up -d
# Grafana http://localhost:3000 (admin / admin), Prometheus http://localhost:9090
services:
  prometheus:
    volumes:
      - ./infrastructure/observability/prometheus-docker.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
  grafana:
    # set APG_GRAFANA_IMAGE=grafana/grafana:latest if the pinned image cannot be downloaded
    image: ${APG_GRAFANA_IMAGE:-grafana/grafana:11.3.1}

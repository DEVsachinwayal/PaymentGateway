  notification-service:
    build:
      context: .
      args: {SERVICE: notification-service, PORT: "8091", HEALTH_PORT: "8091"}
    image: apg/notification-service:${APG_TAG:-dev}
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}

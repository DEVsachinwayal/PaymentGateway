      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in the environment}

  payment-link-service:
    build:
      context: .
      args: {SERVICE: payment-link-service, PORT: "8092", HEALTH_PORT: "8092"}
    image: apg/payment-link-service:${APG_TAG:-dev}

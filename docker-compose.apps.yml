    environment:
      <<: *app-env
      PAYMENTLINK_DB_URL: jdbc:postgresql://postgres:5432/apg_paymentlink
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in the environment}
      PUBLIC_BASE_URL: ${APG_PUBLIC_URL:-http://localhost:8000}

  dashboard:
    build: ./frontend
    image: apg/dashboard:${APG_TAG:-dev}
    restart: unless-stopped
    depends_on: [api-gateway]
    ports: ["${APG_PUBLIC_PORT:-8000}:8080"]

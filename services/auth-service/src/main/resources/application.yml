server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5433/apg_auth}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

apg:
  auth:
    # Access tokens are signed RS256 when JWT_PRIVATE_KEY (base64 PKCS#8 RSA key, >= 2048 bit) is set: only auth-service can mint
    # tokens, the gateway verifies with the public key. Without it HS256 with JWT_SECRET (>= 32 bytes) is used (dev fallback).
    # No defaults for secrets: inject them, never commit them.
    jwt-secret: ${JWT_SECRET:}
    jwt-private-key: ${JWT_PRIVATE_KEY:}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    max-failed-attempts: 5
    lock-duration: 15m

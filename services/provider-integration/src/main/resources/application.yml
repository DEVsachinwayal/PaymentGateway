server:
  port: 8085

spring:
  application:
    name: provider-integration
  datasource:
    url: ${PROVIDER_DB_URL:jdbc:postgresql://localhost:5433/apg_provider}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jackson:
    deserialization:
      accept-float-as-int: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

apg:
  internal:
    token: ${INTERNAL_SERVICE_TOKEN}
  provider:
    payu:
      enabled: true
      priority: 1
      # Secrets come from the environment only (.env locally, OCI secret storage in deployment).
      merchant-key: ${PAYU_MERCHANT_KEY}
      merchant-salt: ${PAYU_MERCHANT_SALT}
      base-url: ${PAYU_BASE_URL:https://test.payu.in}
      connect-timeout: 3s
      read-timeout: 10s

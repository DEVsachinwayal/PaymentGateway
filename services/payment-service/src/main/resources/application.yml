server:
  port: 8084

spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5433/apg_payment}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      # money safety + never let a client smuggle fields such as "status":"SUCCESS"
      accept-float-as-int: false
      fail-on-unknown-properties: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

apg:
  events:
    publisher:
      # relays this service outbox_events table to Kafka (topic = event type); on in dev-start.sh, off in unit tests
      enabled: ${APG_EVENTS_ENABLED:false}
  internal:
    token: ${INTERNAL_SERVICE_TOKEN}
  payment:
    order-service-uri: ${ORDER_SERVICE_URI:http://localhost:8083}

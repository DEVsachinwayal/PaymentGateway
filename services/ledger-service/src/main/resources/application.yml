server:
  port: 8089

spring:
  application:
    name: ledger-service
  datasource:
    url: ${LEDGER_DB_URL:jdbc:postgresql://localhost:5433/apg_ledger}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jackson:
    deserialization:
      accept-float-as-int: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:                       # only used to park poison events on the dead-letter topics
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ledger-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

apg:
  events:
    consumer:
      enabled: ${APG_EVENTS_ENABLED:false}
  internal:
    token: ${INTERNAL_SERVICE_TOKEN}
  ledger:
    # Placeholder pricing until merchant pricing exists: fee = gross * percent-bps / 10000 (half up) + fixed-minor. 0 = no fee.
    fee:
      percent-bps: ${LEDGER_FEE_BPS:0}
      fixed-minor: ${LEDGER_FEE_FIXED_MINOR:0}

server:
  port: 8089

spring:
  application:
    name: ledger-service
  datasource:
    url: ${LEDGER_DB_URL:jdbc:postgresql://localhost:5433/apg_ledger}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jackson:
    deserialization:
      accept-float-as-int: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

apg:
  internal:
    token: ${INTERNAL_SERVICE_TOKEN}
  ledger:
    # Placeholder pricing until merchant pricing exists: fee = gross * percent-bps / 10000 (half up) + fixed-minor. 0 = no fee.
    fee:
      percent-bps: ${LEDGER_FEE_BPS:0}
      fixed-minor: ${LEDGER_FEE_FIXED_MINOR:0}

server:
  port: 8080
  max-http-request-header-size: 16KB

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

management:
  server:
    # actuator (health, prometheus) is NOT served on the public 8080: scrape/probe this internal port only
    port: ${GATEWAY_MANAGEMENT_PORT:8180}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

apg:
  gateway:
    # RS256 (recommended): JWT_PUBLIC_KEY = base64 X.509 public key(s) of auth-service, comma separated during key rotation.
    # The gateway can then verify tokens but never mint them, and a leaked HS secret is useless. If a public key is set the
    # HS256 secret is ignored entirely. Fallback (dev): JWT_SECRET, same value as auth-service. Never commit either.
    jwt-secret: ${JWT_SECRET:}
    jwt-public-key: ${JWT_PUBLIC_KEY:}
    internal-token: ${INTERNAL_SERVICE_TOKEN}
    merchant-uri: ${MERCHANT_SERVICE_URI:http://localhost:8082}
    order-uri: ${ORDER_SERVICE_URI:http://localhost:8083}
    payment-uri: ${PAYMENT_SERVICE_URI:http://localhost:8084}
    orchestrator-uri: ${ORCHESTRATOR_SERVICE_URI:http://localhost:8086}
    webhook-uri: ${WEBHOOK_SERVICE_URI:http://localhost:8087}
    refund-uri: ${REFUND_SERVICE_URI:http://localhost:8088}
    ledger-uri: ${LEDGER_SERVICE_URI:http://localhost:8089}
    settlement-uri: ${SETTLEMENT_SERVICE_URI:http://localhost:8090}
    notification-uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8091}
    payment-link-uri: ${PAYMENT_LINK_SERVICE_URI:http://localhost:8092}
    auth-uri: ${AUTH_SERVICE_URI:http://localhost:8081}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    max-request-bytes: 262144
    rate-limit:
      # per client address; raise for load tests (scripts/perf-start.sh), keep low in production
      replenish-per-second: ${GATEWAY_RATE_LIMIT_RPS:10}
      burst: ${GATEWAY_RATE_LIMIT_BURST:20}

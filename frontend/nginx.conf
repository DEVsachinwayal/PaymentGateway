# Static dashboard + same-origin proxy to the API gateway (no CORS needed). TLS is terminated in front (OCI load balancer).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Re-resolve the gateway name through Docker DNS so a recreated gateway container is found without restarting nginx
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $apg_gateway http://api-gateway:8080;

    include /etc/nginx/security-headers.conf;   # add_header is NOT inherited into locations that set their own, so every location includes it

    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

    location /api/ {
        proxy_pass $apg_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
        client_max_body_size 256k;
    }

    # customer-facing pages served by the gateway (hosted checkout redirect, neutral payment result page)
    location /checkout/ { proxy_pass $apg_gateway; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
    # payment link pages (served by the gateway, which sets their own CSP)
    location /pay/ { proxy_pass $apg_gateway; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
    location = /payment-result { proxy_pass $apg_gateway; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }

    # hashed assets can be cached for a long time, index.html never
    location /assets/ { include /etc/nginx/security-headers.conf; expires 1y; add_header Cache-Control "public, immutable"; }
    location / { include /etc/nginx/security-headers.conf; try_files $uri /index.html; add_header Cache-Control "no-store"; }
}
